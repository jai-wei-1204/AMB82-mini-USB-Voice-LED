<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AMB82-mini USB 語音閃爍燈</title>
<style>
body{font-family:system-ui,"Noto Sans TC",sans-serif;background:#f4f1e8;color:#10212b;min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;box-sizing:border-box}main{width:min(620px,100%);background:#fffdf8;padding:36px;border:1px solid #d7ded8;box-shadow:10px 12px #dbe6df}h1{margin-top:0}.lights{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0}.light{padding:22px;text-align:center;background:#edf1ee;font-weight:bold}.blue{background:#1597e5;color:#fff}.green{background:#2cad70;color:#fff}button{width:100%;margin:6px 0;padding:15px;border:0;background:#10212b;color:#fff;font-size:17px;font-weight:bold;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.listen{background:#d95757}.tools{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:16px 0}.tools button{font-size:14px}.tools input{font-size:16px;text-align:center;border:1px solid #98a8a0}.text{min-height:24px;color:#52636c;margin:10px 0}
</style><main><h1>USB 語音方向燈</h1><p>說「左邊開燈」讓藍燈恆亮；說「右邊開燈」讓綠燈恆亮。閃爍只需說「左邊 3」或「右邊 4」；可選擇加上「次／下」，次數為 1–20。</p><div class="lights"><div id="left" class="light">左邊：藍燈</div><div id="right" class="light">右邊：綠燈</div></div><button id="connect">連接 AMB82-mini（選 COM5）</button><button id="record" disabled>開始語音辨識</button><div class="tools"><button id="blueBlink" disabled>藍燈閃爍</button><input id="count" type="number" min="1" max="20" value="3" aria-label="閃爍次數"><button id="greenBlink" disabled>綠燈閃爍</button></div><div id="heard" class="text">辨識結果：尚未錄音</div><div id="status" class="text">尚未連接開發板</div></main>
<script>
const connect=document.querySelector('#connect'),record=document.querySelector('#record'),heard=document.querySelector('#heard'),status=document.querySelector('#status'),left=document.querySelector('#left'),right=document.querySelector('#right'),count=document.querySelector('#count'),blueBlink=document.querySelector('#blueBlink'),greenBlink=document.querySelector('#greenBlink');let port,writer,recognition;const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;
function render(value){const isLeft=value.includes('left'),isRight=value.includes('right');left.className='light'+(isLeft?' blue':'');right.className='light'+(isRight?' green':'');if(value.startsWith('blinking-'))status.textContent='開發板回報：'+(isLeft?'藍燈':'綠燈')+'正在閃爍 '+value.split(':')[1]+' 次';else status.textContent='開發板回報：兩盞 LED 均關閉';}
function validCount(){const n=Number(count.value);return Number.isInteger(n)&&n>=1&&n<=20?n:0;}
async function readSerial(){const reader=port.readable.getReader(),decoder=new TextDecoder();let text='';try{while(true){const {value,done}=await reader.read();if(done)break;text+=decoder.decode(value,{stream:true});const lines=text.split(/\r?\n/);text=lines.pop();for(const line of lines){if(line.startsWith('STATE:'))render(line.slice(6));else if(line.startsWith('ERROR:'))status.textContent='開發板拒絕指令：'+line.slice(6);}}}catch(e){status.textContent='USB 連線中斷。';}finally{reader.releaseLock();}}
async function send(side,n){if(!n){status.textContent='請輸入 1 到 20 的整數次數。';return;}try{await writer.write(new TextEncoder().encode('blink-'+side+':'+n+'\n'));status.textContent='指令已傳送，等待開發板回報…';}catch(e){status.textContent='USB 傳送失敗，指令未確認送達。';}}
async function turnOn(side){try{await writer.write(new TextEncoder().encode('on-'+side+'\n'));status.textContent='恆亮指令已傳送，等待開發板回報…';}catch(e){status.textContent='USB 傳送失敗，指令未確認送達。';}}
function chineseNumber(value){const map={一:1,二:2,兩:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9,十:10};if(/^\d+$/.test(value))return Number(value);if(map[value])return map[value];if(value.length===2&&value[0]==='十'&&map[value[1]])return 10+map[value[1]];if(value.length===2&&map[value[0]]&&value[1]==='十')return map[value[0]]*10;return 0;}
function parseVoice(text){const side=text.includes('左邊')?'left':text.includes('右邊')?'right':'';const match=text.match(/(?:左邊|右邊)(?:閃爍|閃)?([0-9一二兩三四五六七八九十]+)(?:次|下)?/);return{side,count:match?chineseNumber(match[1]):0,on:side&&(/開燈|恆亮|常亮/.test(text))};}
connect.onclick=async()=>{if(!('serial'in navigator)){status.textContent='請使用電腦版 Chrome 或 Edge。';return;}try{port=await navigator.serial.requestPort();await port.open({baudRate:115200});writer=port.writable.getWriter();connect.textContent='AMB82-mini 已連接';connect.disabled=true;record.disabled=!Recognition;blueBlink.disabled=false;greenBlink.disabled=false;status.textContent=Recognition?'已連接，準備語音辨識。':'已連接；此瀏覽器不支援語音辨識。';readSerial();await writer.write(new TextEncoder().encode('status\n'));}catch(e){const detail=e&&e.name?e.name:'unknown error';status.textContent='無法連接 COM 埠（'+detail+'）。請關閉 Serial Monitor、其他序列工具與已連接的介面分頁後重試。';}};
blueBlink.onclick=()=>send('left',validCount());greenBlink.onclick=()=>send('right',validCount());
if(Recognition){recognition=new Recognition();recognition.lang='zh-TW';recognition.continuous=false;recognition.interimResults=false;recognition.onstart=()=>{record.className='listen';record.textContent='聆聽中…';};recognition.onend=()=>{record.className='';record.textContent='開始語音辨識';};recognition.onerror=e=>{heard.textContent='辨識錯誤：'+e.error+'；沒有傳送控制指令。';};recognition.onresult=e=>{const text=e.results[0][0].transcript.replace(/\s/g,'');heard.textContent='辨識結果：'+text;const result=parseVoice(text);if(result.on)turnOn(result.side);else if(result.side&&result.count>=1&&result.count<=20)send(result.side,result.count);else status.textContent='請說「左邊＋次數」、「右邊＋次數」、左邊開燈或右邊開燈；沒有傳送指令。';};record.onclick=()=>{try{recognition.start()}catch(e){recognition.stop();}};}
</script>
